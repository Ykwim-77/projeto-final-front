<div class="form">
  <div class="leftside">
    <img src="assets/imagens/esqueceuSenha.png" alt="Tela de login">
  </div>
  <div class="rightside">
    <div class="login-title">
      <img src="assets/imagens/logoprogestao.png" alt="Logo" class="login-logo">
      <h2><strong>Pro</strong>Gest</h2>
    </div>
    <br>
    <div id="texto">
      <p>Digite o código de 6 dígitos enviado para seu email</p>
    </div>
    <br>

    <form class="input-container" (ngSubmit)="onSubmit($event)">
      <div class="code-inputs-container">
        <input 
          type="text" 
          maxlength="1" 
          class="code-input" 
          (input)="onInput($event, 0)" 
          (keydown)="onKeyDown($event, 0)"
          (focus)="onFocus($event)"
          (paste)="onPaste($event)"
          #inputRef
          autocomplete="off"
        >
        <input 
          type="text" 
          maxlength="1" 
          class="code-input" 
          (input)="onInput($event, 1)" 
          (keydown)="onKeyDown($event, 1)"
          (focus)="onFocus($event)"
          #inputRef
          autocomplete="off"
        >
        <input 
          type="text" 
          maxlength="1" 
          class="code-input" 
          (input)="onInput($event, 2)" 
          (keydown)="onKeyDown($event, 2)"
          (focus)="onFocus($event)"
          #inputRef
          autocomplete="off"
        >
        <input 
          type="text" 
          maxlength="1" 
          class="code-input" 
          (input)="onInput($event, 3)" 
          (keydown)="onKeyDown($event, 3)"
          (focus)="onFocus($event)"
          #inputRef
          autocomplete="off"
        >
        <input 
          type="text" 
          maxlength="1" 
          class="code-input" 
          (input)="onInput($event, 4)" 
          (keydown)="onKeyDown($event, 4)"
          (focus)="onFocus($event)"
          #inputRef
          autocomplete="off"
        >
        <input 
          type="text" 
          maxlength="1" 
          class="code-input" 
          (input)="onInput($event, 5)" 
          (keydown)="onKeyDown($event, 5)"
          (focus)="onFocus($event)"
          #inputRef
          autocomplete="off"
        >
      </div>

      <br>

      <div *ngIf="errorMessage" class="error-message">
        {{ errorMessage }}
      </div>

      <button type="submit" class="login" [disabled]="!todosCamposPreenchidos()">
        Verificar Código
      </button>
    </form>

    <div class="reenviar-codigo">
      <p>
        Não recebeu o código? 
        <a 
          href="#" 
          (click)="reenviarCodigo()" 
          [class.disabled]="!podeReenviar"
        >
          {{ podeReenviar ? 'Reenviar código' : 'Reenviar em ' + tempoRestante + 's' }}
        </a>
      </p>
    </div>

    <button class="voltar-login" (click)="voltarParaLogin()">
      Voltar para Login
    </button>
  </div>
</div>
