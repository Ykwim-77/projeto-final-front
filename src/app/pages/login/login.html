<app-loading [isLoading]="isLoading"></app-loading>

<div class="form" [class.blur]="isLoading">
    <div class="leftside">
        <img src="../../../assets/imagens/img-left2.png" alt="Tela de login">
    </div>
    <div class="rightside">
        <div class="login-title">
            <img src="../../../assets/imagens/logoprogestao.png" alt="Logo" class="login-logo">
            <h2><strong>Pro</strong>Gest</h2>
        </div>
        
        <!-- Mensagem de erro geral (erro de servidor) -->
        <div class="error-message" *ngIf="errorMessage">
            <i class="fa fa-exclamation-circle"></i>
            {{ errorMessage }}
        </div>

        <form class="input-container" (ngSubmit)="onSubmit($event)" #loginForm="ngForm">
            <!-- Campo Email -->
            <div class="input-wrapper">
                <div class="input" [class.invalid]="getEmailError()">
                    <i class="fa fa-user"></i>
                    <input
                      type="email"
                      [(ngModel)]="email"
                      name="email"
                      placeholder="Email"
                      (input)="onEmailInput()"
                      (blur)="onEmailBlur()"
                    />
                </div>
                <!-- Mensagem de erro específica do email -->
                <div class="field-error" *ngIf="getEmailError()">
                    <i class="fa fa-exclamation-triangle"></i>
                    {{ getEmailError() }}
                </div>
            </div>

            <!-- Campo Senha -->
            <div class="input-wrapper">
                <div class="input" [class.invalid]="getPasswordError()">
                    <i class="fa fa-lock"></i>
                    <input
                      type="password"
                      [(ngModel)]="password"
                      name="password"
                      placeholder="Senha"
                      (input)="onPasswordInput()"
                      (blur)="onPasswordBlur()"
                    />
                </div>
                <!-- Mensagem de erro específica da senha -->
                <div class="field-error" *ngIf="getPasswordError()">
                    <i class="fa fa-exclamation-triangle"></i>
                    {{ getPasswordError() }}
                </div>
            </div>

            <button 
              type="submit" 
              class="login" 
              [disabled]="isLoading"
              [class.loading]="isLoading"
            >
              <span *ngIf="!isLoading">Entrar</span>
              <span *ngIf="isLoading" class="loading-button-text">
                <i class="fa fa-spinner fa-spin"></i>
                Entrando...
              </span>
            </button>
        </form>

        <div class="forgot-password">
            <a (click)="navigateToEsqueceuSenha()" class="forgot-link" [class.disabled]="isLoading">
              <i class="fa fa-key"></i>
              {{ isLoading ? 'Carregando...' : 'Esqueceu a senha?' }}
            </a>
        </div>
    </div>
</div>
